name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Core tests
        run: swift test
      - name: Bundle .app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OWABridge.app
          path: build/OWABridge.app

  extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
